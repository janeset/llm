<!doctype html>
<html lang="en" data-theme="light">

<title>AI Prep · LLM engineering</title>
<meta name="description" content="A 10-week AI engineering course for developers: short lessons, Python exercises checked in your browser, a build every week, Claude and Anthropic courses, and interview practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>
  // Apply the saved theme before first paint so there's no flash.
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem("ai-prep-v1")) || {}; } catch (e) {}
    var t = s.theme || "midnight", r = document.documentElement; // DEFAULT_THEME in app.js
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    r.setAttribute("data-theme", t);
    r.setAttribute("data-density", s.density || "comfortable");
    r.setAttribute("data-keys", s.keys === false ? "off" : "on");
    r.style.fontSize = { s: "14px", m: "16px", l: "17.5px", xl: "19px", xxl: "21px" }[s.fontSize || "m"] || "16px"; // FONT_SIZES in app.js
    if (s.accent) r.style.setProperty("--accent", s.accent);
    if (s.treeW) r.style.setProperty("--tree-w", s.treeW + "px");
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>

<a class="skip-link" href="#view" id="skip">Skip to content</a>

      <span class="brand-name" aria-hidden="true">AI Prep</span><span class="brand-desc" aria-hidden="true">LLM engineering</span>
    </button>
    <!-- Content sections. Learn and Jobs open menus on hover or keyboard focus; the single keys are in data-key
         (Learn also answers to A, its old letter). -->
    <nav id="nav" aria-label="Main">
      <button title="Home (H)" data-nav="home" data-key="h" class="active">Home</button>
      <div class="dd"><button title="Learn: the AI / LLM course (L)" data-track="ai" data-key="l a" aria-haspopup="true" aria-expanded="false">Learn <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button><div class="dd-panel" data-menu="ai"></div></div>

    </nav>
    <!-- Tools (search, console), then preferences (theme, settings), then the one primary action -->
    <div class="top-r">
      <button class="icon-btn" id="search-open" title="Search (Ctrl+K)" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="pill-btn console-btn" id="console-open" title="Console (`)" aria-label="Console"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 17 5-5-5-5M12 18h7"/></svg>Console</button>
      <span class="top-sep" aria-hidden="true"></span>
      <button class="icon-btn" id="theme-quick" title="Switch light / dark" aria-label="Switch to the light theme"></button>
      <button class="icon-btn" id="settings-open" data-key="s" title="Settings (S)" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="pill-btn solid" id="top-cta">Start here</button>
      <button class="icon-btn menu-btn" id="menu-open" aria-label="Menu" aria-expanded="false" aria-controls="menu-sheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <nav class="menu-sheet" id="menu-sheet" aria-label="Site"></nav>
