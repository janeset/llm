<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI / LLM Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>
  // Apply the saved theme before first paint so there's no flash.
  (function () {
    var s = {};
    try { s = JSON.parse(localStorage.getItem("ai-prep-v1")) || {}; } catch (e) {}
    var t = s.theme || "midnight", r = document.documentElement; // DEFAULT_THEME in app.js
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    r.setAttribute("data-theme", t);
    r.setAttribute("data-density", s.density || "comfortable");
    r.setAttribute("data-keys", s.keys === false ? "off" : "on");
    r.style.fontSize = { s: "14px", m: "16px", l: "17.5px", xl: "19px", xxl: "21px" }[s.fontSize || "m"] || "16px"; // FONT_SIZES in app.js
    if (s.accent) r.style.setProperty("--accent", s.accent);
    if (s.treeW) r.style.setProperty("--tree-w", s.treeW + "px");
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brand" title="Go to Home">
      <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><g transform="translate(4 4) scale(.833)" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></g></svg>
      <span class="brand-text"><b>AI Prep</b><small>LLM engineering</small></span>
    </button>
    <nav id="nav" aria-label="Main">
      <button title="Home (H)" data-nav="home" data-key="h" class="active">Home</button>
      <div class="dd"><button title="AI / LLM (A)" data-track="ai" data-key="a" aria-haspopup="true">AI / LLM <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button><div class="dd-panel" data-menu="ai"></div></div>
      <button title="Claude &amp; Anthropic (C)" data-nav="claude" data-key="c">Claude &amp; Anthropic</button>
      <div class="dd"><button title="Jobs: interview, roles and companies (J)" data-jobs data-key="j" aria-haspopup="true">Jobs <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button><div class="dd-panel" data-menu="jobs"></div></div>
    </nav>
    <div class="top-r">
      <button class="icon-btn" id="search-open" title="Search (Ctrl+K)" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="theme-quick" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
      <button class="pill-btn console-btn" id="console-open" title="Console (`)" aria-label="Open the console">Console <kbd aria-hidden="true">`</kbd></button>
      <button class="icon-btn" id="settings-open" data-key="s" title="Settings (S)" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="pill-btn solid" id="top-cta">Start here</button>
      <button class="icon-btn menu-btn" id="menu-open" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <div class="menu-sheet" id="menu-sheet"></div>
  <nav id="subnav" class="subnav" aria-label="Section" hidden></nav>
</header>
<main id="view"></main>
<script src="tracks.js"></script>
<script src="ai.js"></script>
<script src="ai-more.js"></script>
<script src="ai-zero.js"></script>
<script src="ai-modules.js"></script>
<script src="roles.js"></script>

<script src="trackview.js"></script>
<script src="anthropic.js"></script>
<script src="roleview.js"></script>
<script src="interview.js"></script>
<script src="ibmplaylists.js"></script>
<script src="ibmvideos.js"></script>
<script src="router.js"></script>
<script src="search.js"></script>
<script src="console.js"></script>
<script src="app.js"></script>
</body>
</html>
